services:
  postgres:
    image: postgres:17-alpine
    container_name: softscale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_match_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-4681}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - softscale-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: softscale-backend
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-talent_match_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-4681}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-here-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_HOURS=${JWT_REFRESH_TOKEN_EXPIRE_HOURS:-24}
      - JWT_IDLE_TIMEOUT_HOURS=${JWT_IDLE_TIMEOUT_HOURS:-8}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - EMBEDDINGS_DIR=${EMBEDDINGS_DIR:-ai/leads_match/datasets/embeddings}
      - EMBED_MODEL_NAME=${EMBED_MODEL_NAME:-all-MiniLM-L6-v2}
      - ENABLE_PROPOSAL_MODEL=${ENABLE_PROPOSAL_MODEL:-true}
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/ai/leads_match/datasets/embeddings:/app/ai/leads_match/datasets/embeddings
      - ./backend/ai/proposal_generator/base_model:/app/ai/proposal_generator/base_model
      - ./backend/ai/proposal_generator/model:/app/ai/proposal_generator/model
      - ./backend/database:/app/database:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - softscale-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
  jupyter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: softscale-jupyter
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./backend/ai/proposal_generator:/app/ai/proposal_generator
    command: >
      bash -c "
        pip install -q jupyter ipykernel notebook &&
        jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root 
        --NotebookApp.token='' --NotebookApp.password='' 
        --NotebookApp.allow_origin='*' --NotebookApp.disable_check_xsrf=True
      "
    networks:
      - softscale-network
volumes:
  postgres_data:
    driver: local
networks:
  softscale-network:
    driver: bridge
